# Fragmento para o stack do SOC lab.
#
# Opcao A - subir separado (mais simples):
#   docker compose -f docker-compose.bridge.yml up -d --build
#
# Opcao B - colar o bloco "slack-iris-bridge" dentro do seu docker-compose.yml
#   principal, sob "services:", e remover a secao "networks" daqui.

services:
  slack-iris-bridge:
    build: .
    image: soc-lab/slack-iris-bridge:1.0
    container_name: slack-iris-bridge
    hostname: slack-iris-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bridge-data:/data
    networks:
      - soc-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  bridge-data:

networks:
  soc-net:
    # rede ja criada pelo stack principal do SOC (Wazuh/IRIS).
    # Ajuste via .env: SOC_NETWORK=<nome-da-rede-docker>
    external: true
    name: ${SOC_NETWORK:-soc-lab_soc-net}
